[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathpackage"
version = "0.1.0"
description = "Math ops, text similarity, and LLM-as-a-judge utilities"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kamal Dhungana", email = "kbdhunga@mtu.edu" }]
keywords = ["math", "similarity", "llm", "judge", "embeddings"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "anthropic>=0.25.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/mathpackage"
Issues   = "https://github.com/YOUR_USERNAME/mathpackage/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["mathpackage*"]
